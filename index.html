<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Saborcito: video para compartir</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #15140f; background: #f6f5f1; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 440px); margin: auto; padding: 24px 16px 40px; }
    .flag { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
    .flag i { flex: 2; background: #fcd116; } .flag i + i { flex: 1; background: #1d5fc4; } .flag i + i + i { background: #ce1126; }
    h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.1; }
    p { margin: 0 0 14px; line-height: 1.45; color: #4d4c45; }
    video { display: block; width: 100%; aspect-ratio: 9 / 16; background: #06101f; border-radius: 12px; margin-bottom: 14px; }
    .dl { display: block; text-align: center; padding: 16px; border-radius: 999px; background: #06101f; color: #fcd116; font-weight: 800; font-size: 18px; text-decoration: none; }
    .note { font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>¿Antojo de sabor colombiano?</h1>
    <p>Saborcito · video con Tintico · 23 s</p>
    <video controls playsinline preload="metadata" src="saborcito-antojo.mp4"></video>
    <a class="dl" href="saborcito-antojo.mp4" download="Saborcito-antojo.mp4">Descargar video</a>
    <p class="note">En iPhone: toca «Descargar video», luego el ícono de compartir y «Guardar video».</p>
  </main>
</body>
</html>
